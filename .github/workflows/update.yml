name: Update Fast Nodes

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fast-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sing-box
        continue-on-error: true
        run: |
          set -e
          VER=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"v([0-9.]+)".*/\1/')
          echo "sing-box version: $VER"
          curl -fsSL -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version
      - name: Update nodes
        run: python3 scripts/update.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r sub /tmp/sub-new
          git fetch origin main
          git reset --hard origin/main
          rm -rf sub
          cp -r /tmp/sub-new sub
          git add sub/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update fast nodes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
